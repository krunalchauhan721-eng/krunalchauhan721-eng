@keyframes sweep{from{stroke-dashoffset:90}to{stroke-dashoffset:-457}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes rg{0%,30%,100%{opacity:0}12%{opacity:1}}
.rg{animation:rg 5.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-5px)}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
}
