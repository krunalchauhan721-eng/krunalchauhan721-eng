<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 372" width="830" height="372" role="img" aria-labelledby="t d">
<title id="t">Contact</title>
<desc id="d">Have an idea? Let's build it. Krunal Chauhan, Full Stack Engineer.</desc>
<style>
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.sans{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:no-preference){
.orbit{transform-box:view-box;transform-origin:722px 196px;animation:spin 26s linear infinite}
.orbit2{transform-box:view-box;transform-origin:722px 196px;animation:spin 40s linear infinite reverse}
.scan{animation:scan 8s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.marq{animation:marq 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(440px)}}
@keyframes blink{50%{opacity:0}}
@keyframes marq{to{transform:translateX(-1000px)}}
}
</style>
<rect x=".5" y=".5" width="829" height="51" rx="14" fill="#101010" stroke="#2E2620"/><text x="24" y="33" class="mono" font-size="18" fill="#FF6A3D" font-weight="700">05</text><text x="64" y="34" class="mono" font-size="20" fill="#E6D5BD" font-weight="700" letter-spacing="4">CONTACT</text><line x1="214" y1="26" x2="806" y2="26" stroke="#2E2620" stroke-width="2"/><line x1="214" y1="26" x2="294" y2="26" stroke="#D5360C" stroke-width="2"/><g transform="translate(0,72)">
<defs><radialGradient id="fg" cx="690" cy="150" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D5360C" stop-opacity=".34"/><stop offset="1" stop-color="#D5360C" stop-opacity="0"/></radialGradient>
