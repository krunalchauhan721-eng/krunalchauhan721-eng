<g clip-path="url(#fc)"><rect width="830" height="300" fill="#101010"/><rect width="830" height="300" fill="url(#fg)"/>
<circle cx="690" cy="150" r="52" fill="none" stroke="#D5360C" stroke-opacity=".6"/>
