@keyframes sh{from{transform:translateX(-340px) skewX(-20deg)}to{transform:translateX(700px) skewX(-20deg)}}
.sh{animation:sh 4.5s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(2.2)}}
.bar{animation:bar 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes dot{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-10px)}}
.dot{animation:dot 6s ease-in-out infinite}
}
