<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 292" width="830" height="292" role="img" aria-labelledby="t d">
<title id="t">What I work on</title>
<desc id="d">Four focus areas: backend, frontend, AI agents and cloud.</desc>
<style>
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:no-preference){
.orbit{transform-box:view-box;transform-origin:690px 160px;animation:spin 26s linear infinite}
.orbit2{transform-box:view-box;transform-origin:690px 160px;animation:spin 40s linear infinite reverse}
.scan{animation:scan 7s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.flow{stroke-dasharray:5 5;animation:flow 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(330px)}}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-10}}
}
</style>
