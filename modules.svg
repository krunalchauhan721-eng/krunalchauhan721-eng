.in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.blink{animation:blink 1.1s steps(1) infinite}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.spin{animation:spin 30s linear infinite}
.spinr{animation:spin 48s linear infinite reverse}
@keyframes sweep{from{stroke-dashoffset:90}to{stroke-dashoffset:-535}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
.led{animation:led 1.6s ease-in-out infinite}
@keyframes cur{0%{transform:translate(0,0)}35%{transform:translate(34px,16px)}70%{transform:translate(10px,30px)}100%{transform:translate(0,0)}}
.cur{animation:cur 5s ease-in-out infinite}
@keyframes node{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.node{animation:node 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes up{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}
@keyframes cardsh{from{transform:translateX(-200px) skewX(-20deg)}to{transform:translateX(620px) skewX(-20deg)}}
.csh{animation:cardsh 5s ease-in-out infinite}
@keyframes lnk{to{stroke-dashoffset:-16}}
.lnk{stroke-dasharray:4 4;animation:lnk 1.2s linear infinite}
}
</style>
