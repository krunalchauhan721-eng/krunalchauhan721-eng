"#9C9082">Exploring agents,</text><text x="446" y="148" class="sans" font-size="15" fill="#9C9082">LLM workflows and</text><text x="446" y="172" class="sans" font-size="15" fill="#9C9082">smart automation</text><rect x="633" y="4" width="185" height="228" rx="16" fill="#171310" stroke="#2B241E"/><rect x="633" y="4" width="185" height="4" rx="2" fill="#D5360C"/><text x="653" y="46" class="mono" font-size="14" fill="#FF6A3D">04</text><text x="653" y="84" class="sans" font-size="19" font-weight="800" fill="#E6D5BD">CLOUD</text><text x="653" y="124" class="sans" font-size="15" fill="#9C9082">Deployments and</text><text x="653" y="148" class="sans" font-size="15" fill="#9C9082">cloud technologies</text><text x="653" y="172" class="sans" font-size="15" fill="#9C9082">that scale with you</text></g>
