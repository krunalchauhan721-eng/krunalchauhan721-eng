<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 432" width="830" height="432" role="img" aria-labelledby="t d">
<title id="t">What I do</title>
<desc id="d">Four focus areas: backend with Laravel, frontend with React and Next.js, AI agents, and cloud.</desc>
<style>
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.sans{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:no-preference){
.orbit{transform-box:view-box;transform-origin:722px 196px;animation:spin 26s linear infinite}
.orbit2{transform-box:view-box;transform-origin:722px 196px;animation:spin 40s linear infinite reverse}
.scan{animation:scan 8s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.marq{animation:marq 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(440px)}}
@keyframes blink{50%{opacity:0}}
@keyframes marq{to{transform:translateX(-1000px)}}
}
</style>
<rect x=".5" y=".5" width="829" height="51" rx="14" fill="#101010" stroke="#2E2620"/><text x="24" y="33" class="mono" font-size="18" fill="#FF6A3D" font-weight="700">02</text><text x="64" y="34" class="mono" font-size="20" fill="#E6D5BD" font-weight="700" letter-spacing="4">WHAT I DO</text><line x1="250" y1="26" x2="806" y2="26" stroke="#2E2620" stroke-width="2"/><line x1="250" y1="26" x2="330" y2="26" stroke="#D5360C" stroke-width="2"/><g transform="translate(0,72)"><rect x="0.5" y="0.5" width="404" height="169" rx="22" fill="#181311" stroke="#2E2620"/><text x="380" y="100" text-anchor="end" class="sans" font-size="96" font-weight="900" fill="none" stroke="#E6D5BD" stroke-opacity=".14" stroke-width="2">01</text><text x="30" y="70" class="sans" font-size="32" font-weight="800" fill="#E6D5BD">Backend</text><text x="30" y="112" class="sans" font-size="18" fill="#BDB19F">Laravel APIs and scalable</text><text x="30" y="138" class="sans" font-size="18" fill="#BDB19F">services built to last.</text><rect x="425.5" y="0.5" width="404" height="169" rx="22" fill="#181311" stroke="#2E2620"/><text x="805" y="100" text-anchor="end" class="sans" font-size="96" font-weight="900" fill="none" stroke="#E6D5BD" stroke-opacity=".14" stroke-width="2">02</text><text x="455" y="70" class="sans" font-size="32" font-weight="800" fill="#E6D5BD">Frontend</text><text x="455" y="112" class="sans" font-size="18" fill="#BDB19F">React and Next.js interfaces</text><text x="455" y="138" class="sans" font-size="18" fill="#BDB19F">that feel fast and polished.</text><rect x="0.5" y="190.5" width="404" height="169" rx="22" fill="#D5360C" stroke="#FF6A3D"/><text x="380" y="290" text-anchor="end" class="sans" font-size="96" font-weight="900" fill="none" stroke="#FFF3E6" stroke-opacity=".4" stroke-width="2">03</text><text x="30" y="260" class="sans" font-size="32" font-weight="800" fill="#FFF3E6">AI Agents</text><text x="30" y="302" class="sans" font-size="18" fill="#FFF3E6">Exploring agents, LLM workflows</text><text x="30" y="328" class="sans" font-size="18" fill="#FFF3E6">and smart automation.</text><rect x="425.5" y="190.5" width="404" height="169" rx="22" fill="#181311" stroke="#2E2620"/><text x="805" y="290" text-anchor="end" class="sans" font-size="96" font-weight="900" fill="none" stroke="#E6D5BD" stroke-opacity=".14" stroke-width="2">04</text><text x="455" y="260" class="sans" font-size="32" font-weight="800" fill="#E6D5BD">Cloud</text><text x="455" y="302" class="sans" font-size="18" fill="#BDB19F">Deployments and cloud tech</text><text x="455" y="328" class="sans" font-size="18" fill="#BDB19F">that scale with you.</text></g>
</svg>
