<style>
.mono{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.tb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ripple{from{transform:scale(.35);opacity:.7}to{transform:scale(1.9);opacity:0}}
