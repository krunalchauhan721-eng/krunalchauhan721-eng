<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-labelledby="t d">
<title id="t">LinkedIn</title>
<desc id="d">LinkedIn button</desc>
<style>
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.sans{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:no-preference){
.orbit{transform-box:view-box;transform-origin:722px 196px;animation:spin 26s linear infinite}
.orbit2{transform-box:view-box;transform-origin:722px 196px;animation:spin 40s linear infinite reverse}
.scan{animation:scan 8s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.marq{animation:marq 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(440px)}}
@keyframes blink{50%{opacity:0}}
@keyframes marq{to{transform:translateX(-1000px)}}
}
</style>
<rect x="1" y="1" width="258" height="62" rx="32" fill="#D5360C" stroke="#FF6A3D" stroke-width="2"/><text x="34" y="41" class="sans" font-size="23" font-weight="800" fill="#FFF3E6">LinkedIn</text><path d="M212 40 L228 24 M217 24 H228 V35" fill="none" stroke="#FFF3E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
