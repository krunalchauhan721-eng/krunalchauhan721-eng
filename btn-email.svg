<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 72" width="260" height="72" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Email</title>
<desc id="d">Email button</desc>
<style>
.mono{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.tb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
