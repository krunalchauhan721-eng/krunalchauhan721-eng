/><text x="530" y="113" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">Tailwind CSS</text><rect x="606" y="90" width="114" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="663" y="113" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">HTML / CSS</text><line x1="28" y1="142" x2="802" y2="142" stroke="#2B241E" stroke-opacity=".7"/><text x="28" y="181" class="mono" font-size="13" fill="#FF6A3D" letter-spacing="2">AI + CLOUD</text><rect x="160" y="156" width="106" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="213" y="179" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">AI agents</text><rect x="276" y="156" width="114" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="333" y="179" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">Automation</text><rect x="400" y="156" width="72" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="436" y="179" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">Cloud</text><line x1="28" y1="208" x2="802" y2="208" stroke="#2B241E" stroke-opacity=".7"/><text x="28" y="247" class="mono" font-size="13" fill="#FF6A3D" letter-spacing="2">CREATIVE</text><rect x="160" y="222" width="97" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="209" y="245" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">Three.js</text><rect x="267" y="222" width="72" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="303" y="245" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">WebGL</text><rect x="349" y="222" width="64" height="36" rx="10" fill="#171310" stroke="#2B241E"/><text x="381" y="245" text-anchor="middle" class="mono" font-size="14" fill="#E6D5BD">GSAP</text><line x1="28" y1="274" x2="802" y2="274" stroke="#2B241E" stroke-opacity=".7"/></g>
