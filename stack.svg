<title id="t">Tech stack</title>
<desc id="d">Backend: Laravel, PHP, REST APIs. Frontend: React, Next.js, JavaScript, Tailwind CSS, HTML and CSS. AI, cloud and motion: AI agents, automation, cloud, GSAP.</desc>
<style>
.mono{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif}
.tb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ripple{from{transform:scale(.35);opacity:.7}to{transform:scale(1.9);opacity:0}}
@keyframes shimmer{from{transform:translateX(-340px)}to{transform:translateX(700px)}}
.in{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.blink{animation:blink 1.1s steps(1) infinite}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.spin{animation:spin 30s linear infinite}
.spinr{animation:spin 48s linear infinite reverse}
@keyframes sweep{from{stroke-dashoffset:90}to{stroke-dashoffset:-613}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes glow{0%,14%,100%{stroke:#2E2620;fill:#101010}7%{stroke:#FF6A3D;fill:#2a1710}}
.pill{animation:glow 7s ease-in-out infinite}
}
</style>
